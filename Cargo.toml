[package]
name = "usb-can-rs"
version = "0.3.0"
edition = "2021"

[dependencies]
# Core CAN types (no_std compatible)
embedded-can = "0.4"

# Logging backends (pick one; `defmt` takes precedence if both are enabled)
log = { version = "0.4", optional = true }
defmt = { version = "0.3", optional = true }

# std adapter: tokio-serial transport
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "macros"], optional = true }
tokio-serial = { version = "5.4", optional = true }

# Extension adapter: zencan BusManager integration
zencan-common = { version = "0.0.3", default-features = false, features = ["std"], optional = true }

[features]
default = ["std"]
std = []
# Logging: choose at most one of `log` / `defmt`
log = ["dep:log", "zencan-common?/log"]
defmt = ["dep:defmt", "zencan-common?/defmt"]
# std adapter over tokio-serial
tokio-serial = ["std", "dep:tokio", "dep:tokio-serial"]
# zencan adaptor (requires the tokio-serial transport)
zencan = ["tokio-serial", "dep:zencan-common"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
env_logger = "0.11"

[[example]]
name = "tokio_serial_client"
required-features = ["tokio-serial", "log"]

[[example]]
name = "tokio_serial_split"
required-features = ["tokio-serial", "log"]

[[example]]
name = "zencan"
required-features = ["zencan", "log"]

[[test]]
name = "zencan_tests"
required-features = ["zencan"]

[lib]
name = "usb_can"
path = "src/lib.rs"
